name: Release for BRAT

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.16.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-obsidian-release.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      release_files: |
        main.js
        manifest.json
        styles.css
